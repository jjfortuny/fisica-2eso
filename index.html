<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missió Ciència 2n ESO</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
:root{
  --bg:#0b1020; --bg2:#121a33; --card:#18223f; --card2:#1f2b50; --line:#2c3a66;
  --tx:#e8ecff; --mut:#9aa6d1; --acc:#7c9cff; --ok:#34d399; --bad:#f87171; --gold:#facc15;
  --pos:#ef4444; --neg:#3b82f6;
}
*{box-sizing:border-box}
html{font-size:20px}
html,body{margin:0}
body{background:radial-gradient(circle at 20% 0%,#1b2550 0%,var(--bg) 55%) fixed;color:var(--tx);
  font-family:Verdana,"Segoe UI",Tahoma,system-ui,sans-serif;min-height:100vh;line-height:1.6}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
input{font:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;padding:10px 16px;
  background:rgba(18,26,51,.85);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:.3px;cursor:pointer}
.logo span{color:var(--gold)}
.hstats{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.92rem}
.pill{background:var(--card);border:1px solid var(--line);padding:4px 10px;border-radius:999px;white-space:nowrap}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:4px 10px;border-radius:999px}
h1{font-size:1.6rem;margin:.4em 0 .2em}
h2{font-size:1.25rem;margin:.6em 0 .4em}
.sub{color:var(--mut);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15em,1fr));gap:14px}
.world{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;
  display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;transition:transform .15s}
.world:hover{transform:translateY(-3px)}
.world .ico{font-size:2.2rem}
.world .nm{font-weight:700;font-size:1.1rem}
.world .ds{color:var(--mut);font-size:.9rem;flex:1}
.world .stars{font-size:1.2rem;letter-spacing:2px}
.world .row{display:flex;gap:8px;flex-wrap:wrap}
.world.locked{opacity:.6}
.world .bar{position:absolute;left:0;top:0;bottom:0;width:6px}
.btn{background:var(--acc);color:#0b1020;font-weight:700;padding:10px 16px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn.gold{background:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.rank{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:6px 0 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rank .big{font-size:2rem}
.xpbar{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;min-width:180px;flex:1}
.xpbar div{height:100%;background:linear-gradient(90deg,var(--acc),var(--gold))}
/* game */
.qtop{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.hearts{font-size:1.2rem;letter-spacing:2px}
.progress{height:8px;background:var(--card);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress div{height:100%;background:var(--acc);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.tag{display:inline-block;font-size:.9rem;padding:2px 8px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--mut);margin-bottom:8px}
.qtext{font-size:1.15rem;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{background:var(--card2);color:var(--tx);border:2px solid var(--line);padding:12px 14px;text-align:left;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{border-color:var(--ok);background:rgba(52,211,153,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(248,113,113,.12);text-decoration:line-through}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{background:var(--bg);color:var(--tx);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:1.1rem;width:12em;max-width:100%}
.numrow input:focus{outline:none;border-color:var(--acc)}
.help{color:var(--mut);font-size:.95rem;margin-top:6px}
.hintbox{margin-top:14px;display:grid;gap:8px}
.hint{background:rgba(250,204,21,.1);border:1px dashed var(--gold);border-radius:12px;padding:8px 12px;font-size:1rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;display:none}
.fb.ok{display:block;background:rgba(52,211,153,.12);border:1px solid var(--ok)}
.fb.bad{display:block;background:rgba(248,113,113,.1);border:1px solid var(--bad)}
.fb.info{display:block;background:rgba(124,156,255,.1);border:1px solid var(--acc)}
.fb .t{font-weight:700;margin-bottom:4px}
/* builder */
.chain{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:70px;background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:10px}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-weight:600;padding:4px 8px;border-radius:10px;background:var(--card2);border:1px solid var(--line);min-width:64px}
.frac>span:first-child{border-bottom:2px solid var(--tx);padding:0 4px 2px}
.frac>span:last-child{padding:2px 4px 0}
.frac.start{background:#2a2350;border-color:#6d5bd0}
button.frac{color:var(--tx);font-size:1rem}
button.frac:hover{border-color:var(--acc)}
.chain button.frac:hover{border-color:var(--bad)}
.pool{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.x{color:var(--mut);font-weight:700}
.cut{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px;opacity:.6}
.unitstat{margin-top:10px;font-size:1rem}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:20;overflow:auto}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:18px;max-width:900px;width:100%;padding:20px}
.formula{background:var(--bg);border-left:4px solid var(--gold);padding:8px 12px;border-radius:8px;margin:8px 0;font-family:Consolas,monospace;font-size:1.05rem}
.theory p,.theory li{font-size:1rem}
.theory ul{padding-left:20px}
.sim{background:var(--bg);border-radius:14px;padding:10px;margin-top:10px;text-align:center}
.sim svg{width:100%;max-width:420px;height:auto}
.sim .row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.center{text-align:center}
.bigstars{font-size:3rem;letter-spacing:6px;margin:8px 0}
.confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;animation:fall linear forwards;z-index:30}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fig{margin:16px 0;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.fig svg{width:100%;max-width:620px;height:auto;display:block;margin:0 auto}
.fig figcaption{margin-top:10px;font-size:1rem;text-align:left}
.fsbtn{font-weight:800;min-width:2.4em}
footer{color:var(--mut);font-size:.9rem;text-align:center;padding:24px 16px}
footer button{background:none;color:var(--mut);text-decoration:underline;padding:0}
@media (max-width:560px){ h1{font-size:1.35rem} .wrap{padding:12px 16px} }
</style>
</head>
<body>
<header>
  <div class="logo" onclick="goHome()">⚡ Missió <span>Ciència</span></div>
  <div class="hstats">
    <span class="pill" id="hName">👩‍🔬</span>
    <span class="pill" id="hXp">0 XP</span>
    <button class="iconbtn fsbtn" onclick="fontSize(-2)" title="Lletra més petita" aria-label="Lletra més petita">A−</button>
    <button class="iconbtn fsbtn" onclick="fontSize(2)" title="Lletra més gran" aria-label="Lletra més gran" style="font-size:1.15em">A+</button>
    <button class="iconbtn" id="hSound" onclick="toggleSound()">🔊</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer>
  Fet per practicar Física i Química de 2n d'ESO · Progrés desat en aquest navegador ·
  <button onclick="resetAll()">Reiniciar progrés</button>
</footer>
<div id="modal"></div>

<script>
/* ===================== UTILITATS ===================== */
const E = 1.6e-19, K = 9e9, C = 3e8;
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const SUPR = Object.fromEntries(Object.entries(SUP).map(([a,b])=>[b,a]));
const sup = n => String(n).split('').map(c=>SUP[c]||c).join('');
function dec(x,d=3){ return String(+(+x).toFixed(d)).replace('.',','); }
function fmt(x){
  if(x===0) return '0';
  const ax=Math.abs(x);
  if(ax>=1e5 || ax<1e-3){
    let e=Math.floor(Math.log10(ax)); let m=x/Math.pow(10,e);
    m=+m.toFixed(2); if(Math.abs(m)>=10){m/=10;e++;}
    const ms = m===1 ? '' : (m===-1 ? '−' : dec(m,2).replace('-','−')+' · ');
    return ms+'10'+sup(e);
  }
  return dec(+x.toPrecision(4),3).replace('-','−');
}
function fmtT(v){ if(v>=1e4 && Number.isInteger(Math.log10(v))) return '10'+sup(Math.log10(v)); return dec(v); }
function parseNum(raw){
  let s=String(raw).trim().replace(/\s/g,'').replace(/[−–]/g,'-');
  if(!s) return NaN;
  s=s.replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, m=>'^'+m.split('').map(c=>SUPR[c]).join(''));
  s=s.replace(/\^\^/g,'^');
  // punt com a separador de milers (3.600) si no hi ha coma
  if(!s.includes(',') && /^[+-]?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  s=s.replace(/,/g,'.');
  if(/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(s)) return parseFloat(s);
  let m=s.match(/^([+-]?(?:\d+\.?\d*|\.\d+))[x×·*]10\^?\(?([+-]?\d+)\)?$/i);
  if(m) return parseFloat(m[1])*Math.pow(10,+m[2]);
  m=s.match(/^([+-]?)10\^\(?([+-]?\d+)\)?$/);
  if(m) return (m[1]==='-'?-1:1)*Math.pow(10,+m[2]);
  return NaN;
}

/* ===================== PREGUNTES TIPUS TEST ===================== */
/* La primera opció és sempre la correcta (després es barregen). */
const MC_CARREGA = [
 {q:"Quina partícula de l'àtom té càrrega elèctrica <b>negativa</b>?", o:["L'electró","El protó","El neutró","El nucli"],
  h:["No és dins del nucli: es mou al seu voltant.","És la partícula que passa d'un cos a un altre quan els freguem."],
  e:"L'electró té càrrega negativa (−1,6·10⁻¹⁹ C). El protó és positiu i el neutró no té càrrega."},
 {q:"Un cos que <b>guanya</b> electrons queda carregat…", o:["Negativament","Positivament","No es carrega","Depèn de la seva massa"],
  h:["Els electrons són negatius.","Si afegeixes càrregues negatives, quin signe sobra?"],
  e:"Si guanya electrons, té més electrons que protons → càrrega negativa."},
 {q:"Un cos que <b>perd</b> electrons queda carregat…", o:["Positivament","Negativament","No es carrega","Depèn de la temperatura"],
  h:["Els protons es queden al nucli, no es mouen.","Si marxen càrregues negatives, quines en sobren?"],
  e:"Si perd electrons, hi ha més protons que electrons → càrrega positiva."},
 {q:"Quina és la unitat de càrrega elèctrica al Sistema Internacional?", o:["El coulomb (C)","El newton (N)","El volt (V)","El joule (J)"],
  h:["Porta el nom del físic francès Charles-Augustin de …","El seu símbol és la lletra C."],
  e:"La càrrega es mesura en coulombs (C). Com que 1 C és molt gran, sovint es fan servir µC (10⁻⁶ C) i nC (10⁻⁹ C)."},
 {q:"Un àtom és elèctricament <b>neutre</b> quan…", o:["Té el mateix nombre de protons que d'electrons","No té electrons","Té més neutrons que protons","Té el mateix nombre de neutrons que d'electrons"],
  h:["Els neutrons no tenen càrrega, així que no compten.","Les càrregues + i − s'han de compensar."],
  e:"Si hi ha tants protons (+) com electrons (−), les càrregues es compensen i l'àtom és neutre."},
 {q:"Freguem un globus amb el cabell i després s'enganxa a la paret. Quin tipus d'electrització s'ha produït en fregar-lo?", o:["Per fregament","Per contacte","Per inducció","Per fusió"],
  h:["Fixa't en el verb de la pregunta.","Quan dos materials es freguen, els electrons passen d'un a l'altre."],
  e:"És electrització per fregament: en fregar, uns electrons passen del cabell al globus."},
 {q:"Quines partícules passen d'un cos a l'altre quan s'electritzen?", o:["Els electrons","Els protons","Els neutrons","Els nuclis sencers"],
  h:["Els protons estan molt ben lligats dins del nucli.","Són les partícules més lleugeres i externes de l'àtom."],
  e:"Només es mouen els electrons. Els protons es queden al nucli."},
 {q:"Quin d'aquests materials és un bon <b>conductor</b> elèctric?", o:["El coure","El plàstic","El vidre","La fusta"],
  h:["Els cables elèctrics porten aquest material per dins.","És un metall de color vermellós."],
  e:"Els metalls com el coure són conductors: els electrons s'hi mouen fàcilment. Plàstic, vidre i fusta són aïllants."},
 {q:"Acostem una vareta carregada a un objecte <b>sense tocar-lo</b> i les seves càrregues es redistribueixen. Com s'anomena?", o:["Electrització per inducció","Electrització per fregament","Electrització per contacte","Fissió"],
  h:["No hi ha contacte ni fregament.","La paraula vol dir «provocar a distància»."],
  e:"És la inducció: les càrregues de l'objecte es reorganitzen per l'atracció o repulsió de la vareta, sense tocar-se."},
 {q:"Quin valor té la càrrega d'un electró?", o:["−1,6 · 10⁻¹⁹ C","−1 C","+1,6 · 10⁻¹⁹ C","−9 · 10⁹ C"],
  h:["És negativa.","És un nombre molt, molt petit."],
  e:"La càrrega de l'electró és −1,6·10⁻¹⁹ C. El protó té la mateixa quantitat però positiva."},
 {q:"La càrrega elèctrica es <b>conserva</b>. Si el globus guanya 1000 electrons en fregar-lo amb el cabell, el cabell…", o:["N'ha perdut 1000","N'ha guanyat 1000","No canvia","Els electrons es destrueixen"],
  h:["Els electrons no apareixen del no-res.","D'on han sortit els electrons del globus?"],
  e:"La càrrega no es crea ni es destrueix: els 1000 electrons del globus venen del cabell, que queda positiu."},
];

const MC_FORCES = [
 {q:"Què passa entre dues càrregues <b>positives</b>?", o:["Es repel·leixen","S'atrauen","No interaccionen","Depèn de la seva massa"],
  h:["Recorda la regla: iguals…","Càrregues del mateix signe s'allunyen."],
  e:"Càrregues del mateix signe es repel·leixen; de signe contrari s'atrauen."},
 {q:"Què passa entre una càrrega <b>positiva</b> i una de <b>negativa</b>?", o:["S'atrauen","Es repel·leixen","No interaccionen","Es destrueixen"],
  h:["Recorda la regla: contraris…","Com els pols diferents de dos imants."],
  e:"Càrregues de signe contrari s'atrauen."},
 {q:"Si la distància entre dues càrregues es fa el <b>doble</b>, la força…", o:["Es divideix entre 4","Es divideix entre 2","Es duplica","No canvia"],
  h:["A la llei de Coulomb la distància està elevada al quadrat.","2² = 4, i la distància està dividint."],
  e:"F = k·q₁·q₂/d². Si d es fa el doble, d² es fa 4 vegades més gran, i la força es divideix entre 4."},
 {q:"Si dupliquem el valor d'<b>una</b> de les càrregues, la força…", o:["Es duplica","Es quadruplica","Es divideix entre 2","No canvia"],
  h:["Les càrregues estan multiplicant a la fórmula.","No estan elevades al quadrat."],
  e:"La força és proporcional a q₁·q₂: si una es duplica, la força també es duplica."},
 {q:"Quina llei descriu la força entre dues càrregues elèctriques?", o:["La llei de Coulomb","La llei de la gravitació de Newton","La llei de Hooke","La llei de Lavoisier"],
  h:["Té el mateix nom que la unitat de càrrega.","F = k · q₁ · q₂ / d²"],
  e:"La llei de Coulomb: F = k·q₁·q₂/d²."},
 {q:"Quin valor té la constant <b>k</b> de la llei de Coulomb (al buit o a l'aire)?", o:["9 · 10⁹ N·m²/C²","6,67 · 10⁻¹¹ N·m²/kg²","1,6 · 10⁻¹⁹ C","3 · 10⁸ m/s"],
  h:["És un nombre molt gran.","Comença per 9."],
  e:"k = 9·10⁹ N·m²/C². (6,67·10⁻¹¹ és la constant de la gravitació, 1,6·10⁻¹⁹ C la càrrega de l'electró i 3·10⁸ m/s la velocitat de la llum.)"},
 {q:"En què es diferencia la força elèctrica de la força gravitatòria?", o:["L'elèctrica pot atreure o repel·lir; la gravitatòria només atrau","Totes dues només atrauen","L'elèctrica no depèn de la distància","La gravitatòria pot repel·lir"],
  h:["Hi ha dos tipus de càrrega, però només un tipus de massa.","Has vist mai una massa que repel·leixi una altra massa?"],
  e:"Com que hi ha càrregues + i −, la força elèctrica pot ser atractiva o repulsiva. La gravitatòria sempre és atractiva."},
 {q:"En quina unitat es mesura la força elèctrica?", o:["El newton (N)","El coulomb (C)","El metre (m)","El watt (W)"],
  h:["És la mateixa unitat que qualsevol altra força.","Porta el nom de qui va estudiar la gravetat i la poma."],
  e:"Totes les forces es mesuren en newtons (N)."},
 {q:"Per fer servir la llei de Coulomb, en quines unitats han d'anar la càrrega i la distància?", o:["Coulombs (C) i metres (m)","Microcoulombs (µC) i centímetres (cm)","Coulombs (C) i quilòmetres (km)","Newtons (N) i metres (m)"],
  h:["Cal fer servir les unitats del Sistema Internacional.","Per això necessitem els factors de conversió!"],
  e:"Sempre en unitats del SI: càrrega en C i distància en m. Si et donen µC o cm, primer els has de convertir."},
];

const MC_NUCLEAR = [
 {q:"Què és la <b>fissió</b> nuclear?", o:["Un nucli pesant es divideix en dos nuclis més petits","Dos nuclis lleugers s'uneixen","Un electró canvia d'òrbita","Una combustió química"],
  h:["«Fissura» vol dir trencadura.","Passa a l'urani de les centrals nuclears."],
  e:"A la fissió, un nucli pesant (com l'urani-235) es trenca en dos de més petits i allibera molta energia i neutrons."},
 {q:"Què és la <b>fusió</b> nuclear?", o:["Dos nuclis lleugers s'uneixen per formar-ne un de més pesant","Un nucli pesant es divideix","Un sòlid es converteix en líquid","Un àtom perd electrons"],
  h:["«Fusionar» vol dir ajuntar.","Passa amb l'hidrogen a dins de les estrelles."],
  e:"A la fusió, nuclis lleugers (com els d'hidrogen) s'uneixen i formen heli, alliberant moltíssima energia."},
 {q:"On es produeix la fusió nuclear de manera natural?", o:["Al Sol i a les estrelles","A la central d'Ascó","Als volcans","En els llamps"],
  h:["Necessita temperatures de milions de graus.","Ens arriba en forma de llum i calor cada dia."],
  e:"El Sol obté la seva energia fusionant hidrogen en heli. Les centrals nuclears actuals fan servir la fissió."},
 {q:"Quin és el combustible més habitual de les centrals nuclears?", o:["L'urani-235","El carbó","El petroli","El gas natural"],
  h:["És un element molt pesant, amb 92 protons.","El seu nom ve del planeta Urà."],
  e:"Les centrals nuclears fan servir urani enriquit en urani-235, que es divideix fàcilment per fissió."},
 {q:"Quina partícula xoca contra el nucli d'urani per iniciar la fissió?", o:["Un neutró","Un electró","Un protó","Un fotó de llum"],
  h:["No té càrrega, i per això el nucli no la repel·leix.","És una de les partícules que formen el nucli."],
  e:"Un neutró impacta contra l'urani-235, que es trenca i allibera 2 o 3 neutrons nous."},
 {q:"Què és una <b>reacció en cadena</b>?", o:["Els neutrons alliberats en una fissió provoquen noves fissions","Una sèrie de combustions de carbó","Electrons que salten d'àtom en àtom","Una reacció que només passa una vegada"],

const mkTile = t => ({tv:t[0],tu:t[1],bv:t[2],bu:t[3]});
const tileTxt = t => `(${fmtT(t.tv)} ${t.tu} / ${fmtT(t.bv)} ${t.bu})`;
function genBuild(def){
  def = def || rnd(BUILD);
  const v=rnd(def.v), good=def.tiles.map(mkTile);
  const inv=good.map(t=>({tv:t.bv,tu:t.bu,bv:t.tv,bu:t.tu}));
  const pool=shuffle([...good,...inv,...def.extra.map(mkTile)]).map((t,i)=>({...t,id:i}));
  const ans=def.f(v);
  return {type:'build', tag:'🔧 Constructor de factors', text:`Converteix <b>${dec(v)} ${def.fl}</b> a <b>${def.tl}</b>. Clica els factors de conversió correctes per posar-los a la cadena!`,
    start:{v, units:{...def.from}}, target:def.to, tl:def.tl, pool, chain:[], answer:ans, unit:def.tl,
    hints:["Tria factors on la unitat que vols eliminar quedi a l'altra banda de la fracció (si és a dalt, ha d'anar a baix) per poder-la simplificar.",
      `Necessites ${good.length===1?'aquest factor':'aquests factors'}: ${good.map(tileTxt).join(' i ')}`,
      `Calcula: ${dec(v)} ${good.map(t=>`· ${fmtT(t.tv)} / ${fmtT(t.bv)}`).join(' ')}`],
    explain:`${dec(v)} ${def.fl} ${good.map(t=>'· '+tileTxt(t)).join(' ')} = <b>${fmt(ans)} ${def.tl}</b>`};
}

let AC=null;
function beep(kind){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const notes = kind==='ok'?[523,659,784]:kind==='win'?[523,659,784,1047]:kind==='hint'?[880]:[220,170];
    const t0=AC.currentTime;
    notes.forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=kind==='bad'?'sawtooth':'triangle';
      o.frequency.value=f; o.connect(g); g.connect(AC.destination); const t=t0+i*0.1;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.15,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
      o.start(t); o.stop(t+0.2); });
  }catch(e){}
}

function showTheory(id){
  const w=WORLDS.find(x=>x.id===id);
  document.getElementById('modal').innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box theory">
    ${w.theory}
    <div class="actions"><button class="btn" style="background:${w.color}" onclick="startRound('${id}')">▶ Ja ho tinc, a jugar!</button><button class="btn ghost" onclick="closeModal()">Tancar</button></div>
  </div></div>`;
  if(id==='forces') initSim();
}
function closeModal(){ document.getElementById('modal').innerHTML=''; }

function initSim(){
  let s1=1, s2=-1;
  const svg=document.getElementById('simsvg'), sl=document.getElementById('simd');
  const b1=document.getElementById('b1'), b2=document.getElementById('b2');
  function draw(){
    const d=+sl.value/10, F=K*2e-6*2e-6/(d*d), attract=s1*s2<0;
    const cx=170, half=34+(d-0.1)/0.4*100, x1=cx-half, x2=cx+half, y=85;
    let len=12+F/3.6*70; if(attract) len=Math.min(len, half-8);
    const col=s=>s>0?'var(--pos)':'var(--neg)';
    const dir1 = attract?1:-1;
    svg.innerHTML = `<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#facc15"/></marker></defs>
      <line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#2c3a66" stroke-dasharray="4 4"/>
      <line x1="${x1}" y1="34" x2="${x1+dir1*len}" y2="34" stroke="#facc15" stroke-width="4" marker-end="url(#ar)"/>
      <line x1="${x2}" y1="34" x2="${x2-dir1*len}" y2="34" stroke="#facc15" stroke-width="4" marker-end="url(#ar)"/>
      <circle cx="${x1}" cy="${y}" r="20" fill="${col(s1)}"/><text x="${x1}" y="${y+8}" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">${s1>0?'+':'−'}</text>
      <circle cx="${x2}" cy="${y}" r="20" fill="${col(s2)}"/><text x="${x2}" y="${y+8}" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">${s2>0?'+':'−'}</text>`;
    document.getElementById('simdt').textContent = `${dec(d*100)} cm = ${dec(d)} m`;
    document.getElementById('simf').innerHTML = `F = ${fmt(F)} N → <b>${attract?'S\'atrauen 🤝':'Es repel·leixen 💥'}</b>`;
    b1.textContent=`Càrrega 1: ${s1>0?'+':'−'}`; b2.textContent=`Càrrega 2: ${s2>0?'+':'−'}`;
  }
  b1.onclick=()=>{s1=-s1;draw();}; b2.onclick=()=>{s2=-s2;draw();}; sl.oninput=draw; draw();
}

/* ---------- Partida ---------- */
let R=null;
function prepMC(q){ return {type:'mc', tag:'❓ Test', text:q.q, options:shuffle(q.o), answer:q.o[0], hints:q.h, explain:q.e}; }
function makeQs(id){
  if(id==='final'){
    const qs=[];
    WORLDS.forEach(w=>{ shuffle(w.mc).slice(0,1).forEach(q=>qs.push(prepMC(q))); });
    qs.push(GEN_CARREGA[0](), GEN_CARREGA[1](), GEN_FORCES[0](), GEN_NUCLEAR[rnd([0,2])](), genBuild(BUILD[rnd([0,1])]), genBuild());
    return shuffle(qs);
  }
  const w=WORLDS.find(x=>x.id===id);
  const mcs=shuffle(w.mc).slice(0,w.nMC).map(prepMC);
  const gens=[]; const order=shuffle(w.gens);
  for(let i=0;i<w.nGen;i++) gens.push(order[i%order.length]());
  return shuffle([...mcs,...gens]);
}
function startRound(id){
  closeModal();
  const w = id==='final'?FINAL:WORLDS.find(x=>x.id===id);
  R={id, w, qs:makeQs(id), i:0, lives:5, score:0, base:0, streak:0, bestStreak:0, correct:0, hintsTotal:0};
  R.qs.forEach(q=>{ q.hintsUsed=0; q.attempts=0; q.done=false; });
  renderQ(); window.scrollTo(0,0);
}
function renderQ(){
  const q=R.qs[R.i], n=R.qs.length;
  let body='';
  if(q.type==='mc'){
    body = `<div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}" onclick="pickMC(${i})">${o}</button>`).join('')}</div>`;
  } else if(q.type==='num'){
    body = numInput(q);
  } else {
    body = `<div class="chain" id="chain"></div><div class="unitstat" id="ustat"></div>
      <div class="help">Factors disponibles (clica per afegir-los; clica'ls a la cadena per treure'ls):</div>
      <div class="pool" id="pool"></div>
      <div id="bAns" style="display:none;margin-top:14px">${numInput(q)}</div>`;
  }
  app.innerHTML = `
    <div class="qtop">
      <div><b style="color:${R.w.color}">${R.w.icon} ${R.w.name}</b> · Pregunta ${R.i+1}/${n}</div>
      <div class="hearts" title="Vides">${'❤️'.repeat(R.lives)}${'🖤'.repeat(Math.max(0,5-R.lives))}</div>
      <div><span class="pill">⭐ ${R.score}</span> ${R.streak>=2?`<span class="pill">🔥 Ratxa ${R.streak}</span>`:''}</div>
    </div>
    <div class="progress"><div style="width:${R.i/n*100}%;background:${R.w.color}"></div></div>
    <div class="card" id="qcard">
      <span class="tag">${q.tag||''}</span>
      <div class="qtext">${q.text}</div>
      ${body}
      <div class="hintbox" id="hints">${q.hints.slice(0,q.hintsUsed).map((h,i)=>`<div class="hint">💡 <b>Pista ${i+1}:</b> ${h}</div>`).join('')}</div>
      <div class="actions" id="acts"></div>
      <div class="fb" id="fb"></div>
    </div>
    <div class="actions"><button class="btn ghost" onclick="if(confirm('Vols sortir? Perdràs aquesta partida.'))goHome()">🏠 Sortir</button></div>`;
  renderActs();
  if(q.type==='build') renderBuild();
  const inp=document.getElementById('ans'); if(inp && q.type==='num') inp.focus();
}
function numInput(q){
  return `<div class="numrow"><input id="ans" autocomplete="off" placeholder="La teva resposta" onkeydown="if(event.key==='Enter')submitNum()"><b>${q.unit||''}</b>
    <button class="btn" onclick="submitNum()">Comprovar</button></div>
    <div class="help">Fes servir la coma per als decimals. Per a potències de 10 pots escriure <b>1,6e-19</b> o <b>1,6·10^-19</b>.</div>`;
}
function renderActs(){
  const q=R.qs[R.i], left=q.hints.length-q.hintsUsed, a=document.getElementById('acts');
  if(q.done){
    const last=R.i>=R.qs.length-1 || R.lives<=0;
    a.innerHTML = `<button class="btn ok" id="nextb" onclick="nextQ()">${last?'🏁 Veure resultats':'Següent ➜'}</button>`;
    setTimeout(()=>{ const b=document.getElementById('nextb'); if(b) b.focus(); },50);
  } else {
    a.innerHTML = `<button class="btn gold" ${left?'':'disabled'} onclick="useHint()">💡 Pista ${left?`(${left} ${left===1?'queda':'queden'}, −25 punts)`:'(no en queden)'}</button>`;
  }
}
function useHint(){
  const q=R.qs[R.i]; if(q.done || q.hintsUsed>=q.hints.length) return;
  q.hintsUsed++; R.hintsTotal++; beep('hint');
  const h=document.getElementById('hints');
  h.insertAdjacentHTML('beforeend', `<div class="hint">💡 <b>Pista ${q.hintsUsed}:</b> ${q.hints[q.hintsUsed-1]}</div>`);
  renderActs();
}
function pickMC(i){
  const q=R.qs[R.i]; if(q.done) return;
  const btn=document.querySelector(`.opt[data-i="${i}"]`);
  const ok = q.options[i]===q.answer;
  if(ok){ btn.classList.add('right'); }
  else { btn.classList.add('wrong'); btn.disabled=true; }
  result(ok);
  if(q.done) document.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(q.options[+b.dataset.i]===q.answer) b.classList.add('right'); });
}
function submitNum(){
  const q=R.qs[R.i]; if(q.done) return;
  const inp=document.getElementById('ans'); const u=parseNum(inp.value);
  if(isNaN(u)){ fb('info','🤔 No entenc aquest número','Escriu només el número. Exemples: <b>20</b>, <b>0,25</b>, <b>3,2e-6</b> o <b>3,2·10^-6</b>.'); return; }
  const a=q.answer, tol=Math.abs(a)*0.025+1e-300;
  let ok=false, msg='';
  if(Math.abs(u-a)<=tol) ok=true;
  else if(Math.abs(Math.abs(u)-Math.abs(a))<=tol){ if(q.signMatters) msg='El número és correcte, però <b>compte amb el signe</b>! Ha guanyat o perdut electrons?'; else ok=true; }
  else if(u!==0){ const l=Math.log10(Math.abs(u)/Math.abs(a)); if(Math.abs(l-Math.round(l))<0.012) msg=`Les xifres són bones, però la <b>potència de 10</b> no (t'has desviat ${Math.abs(Math.round(l))} ${Math.abs(Math.round(l))===1?'zero':'zeros'}). Revisa les unitats i els exponents!`; }
  result(ok,msg);
  if(q.done) inp.disabled=true;
}
function result(ok,msg){
  const q=R.qs[R.i];
  if(ok){
    q.done=true;
    const base=Math.max(10, 100-25*q.hintsUsed-(q.attempts?40:0));
    R.streak++; R.bestStreak=Math.max(R.bestStreak,R.streak);
    const bonus=R.streak>=2?Math.min(50,(R.streak-1)*10):0;
    R.base+=base; R.score+=base+bonus; R.correct++;
    beep('ok');
    fb('ok', `✅ Correcte! +${base}${bonus?` (+${bonus} per la ratxa 🔥)`:''}`, q.explain);
  } else {
    R.lives--; R.streak=0; beep('bad');
    document.getElementById('qcard').classList.remove('shake'); void document.getElementById('qcard').offsetWidth; document.getElementById('qcard').classList.add('shake');
    if(q.attempts===0 && R.lives>0){
      q.attempts=1;
      fb('bad','❌ No és correcte… torna-ho a provar!', (msg?msg+'<br>':'')+(q.hintsUsed<q.hints.length?'Si vols, demana una 💡 pista.':'Rellegeix les pistes amb calma.'));
    } else {
      q.done=true;
      const sol = q.type==='mc' ? `La resposta correcta era: <b>${q.answer}</b>.` : `La resposta correcta era: <b>${fmt(q.answer)} ${q.unit||''}</b>.`;
      fb('bad', R.lives<=0?'💔 T\'has quedat sense vides!':'❌ Aquesta vegada no ha pogut ser', `${msg?msg+'<br>':''}${sol}<br>${q.explain}`);
    }
  }
  updateTop(); renderActs();
}
function updateTop(){
  const h=document.querySelector('.hearts'); if(h) h.textContent='❤️'.repeat(Math.max(0,R.lives))+'🖤'.repeat(Math.max(0,5-R.lives));
  const t=document.querySelector('.qtop>div:last-child'); if(t) t.innerHTML=`<span class="pill">⭐ ${R.score}</span> ${R.streak>=2?`<span class="pill">🔥 Ratxa ${R.streak}</span>`:''}`;
}
function fb(kind,title,body){ const f=document.getElementById('fb'); f.className='fb '+kind; f.innerHTML=`<div class="t">${title}</div><div>${body||''}</div>`; }
function nextQ(){
  if(R.lives<=0 || R.i>=R.qs.length-1) return endRound();
  R.i++; renderQ(); window.scrollTo(0,0);
}

/* ---------- Constructor ---------- */
function unitsOf(q){
  const u={...q.start.units};
  q.chain.forEach(t=>{ u[t.tu]=(u[t.tu]||0)+1; u[t.bu]=(u[t.bu]||0)-1; });
  Object.keys(u).forEach(k=>{ if(!u[k]) delete u[k]; });
  return u;
}
function uLabel(u){
  const ex=(k,e)=>k+(Math.abs(e)>1?sup(Math.abs(e)):'');
  const num=Object.keys(u).filter(k=>u[k]>0).map(k=>ex(k,u[k])), den=Object.keys(u).filter(k=>u[k]<0).map(k=>ex(k,u[k]));
  return (num.join('·')||'1')+(den.length?'/'+den.join('·'):'');
}
const sameU=(a,b)=>{ const ka=Object.keys(a), kb=Object.keys(b); return ka.length===kb.length && ka.every(k=>a[k]===b[k]); };
function renderBuild(){
  const q=R.qs[R.i], fin=unitsOf(q);
  const cut=(unit,sign)=>{ const f=fin[unit]||0; return (f===0 || Math.sign(f)!==sign) ? `<span class="cut">${unit}</span>` : unit; };
  const su=q.start.units, num=Object.keys(su).filter(k=>su[k]>0), den=Object.keys(su).filter(k=>su[k]<0);
  const startHtml = den.length
    ? `<span class="frac start"><span>${dec(q.start.v)} ${num.map(u=>cut(u,1)).join('·')}</span><span>1 ${den.map(u=>cut(u,-1)).join('·')}</span></span>`
    : `<span class="frac start" style="justify-content:center;min-height:52px"><span style="border:0">${dec(q.start.v)} ${num.map(u=>cut(u,1)).join('·')}</span></span>`;
  const tile=(t,where)=>`<button class="frac" ${q.done?'disabled':''} onclick="${where}(${t.id})" title="${where==='addT'?'Afegir':'Treure'}"><span>${fmtT(t.tv)} ${where==='remT'?cut(t.tu,1):t.tu}</span><span>${fmtT(t.bv)} ${where==='remT'?cut(t.bu,-1):t.bu}</span></button>`;
  document.getElementById('chain').innerHTML = startHtml + q.chain.map(t=>`<span class="x">·</span>`+tile(t,'remT')).join('');
  document.getElementById('pool').innerHTML = q.pool.filter(t=>!q.chain.includes(t)).map(t=>tile(t,'addT')).join('') || '<span class="help">No queden factors.</span>';
  const ok=sameU(fin,q.target);
  document.getElementById('ustat').innerHTML = `Unitats ara: <b>${uLabel(fin)}</b> &nbsp;→&nbsp; objectiu: <b>${q.tl}</b> ${ok?'✅ Perfecte! Ara calcula el resultat.':(q.chain.length?'⏳ Encara no…':'')}`;
  const b=document.getElementById('bAns');
  const wasHidden = b.style.display==='none';
  b.style.display = ok?'block':'none';
  if(ok && wasHidden && !q.done){ const i=document.getElementById('ans'); if(i) i.focus(); }
}
function addT(id){ const q=R.qs[R.i]; if(q.done) return; q.chain.push(q.pool.find(t=>t.id===id)); beep('hint'); renderBuild(); }
function remT(id){ const q=R.qs[R.i]; if(q.done) return; q.chain=q.chain.filter(t=>t.id!==id); renderBuild(); }

/* ---------- Final de ronda ---------- */
function endRound(){
  const n=R.qs.length, pct=R.base/(n*100), over=R.lives<=0;
  const stars = over?0: pct>=0.85?3: pct>=0.65?2: pct>=0.4?1:0;
  const prevRank=rankOf(S.xp);
  S.xp+=R.score; S.played++;
  const id=R.id; const newBest = R.score>(S.best[id]||0);
  S.stars[id]=Math.max(S.stars[id]||0,stars); if(newBest) S.best[id]=R.score;
  save(); hdr();
  const nr=rankOf(S.xp), up=nr>prevRank;
  const msgs = over ? ['No passa res! Equivocar-se és part d\'aprendre. Repassa la 📖 Teoria i torna-ho a provar 💪']
    : stars===3 ? ['Increïble! Ets un crack de la ciència! 🤩','Perfecte! Einstein estaria orgullós! 🧠']
    : stars===2 ? ['Molt bé! Una mica més i aconsegueixes les 3 estrelles!']
    : stars===1 ? ['Bé! Ja tens una estrella. Prova de demanar menys pistes per aconseguir-ne més.']
    : ['Encara ho pots fer millor. Repassa la teoria i torna-hi!'];
  app.innerHTML = `<div class="card center" style="margin-top:20px">
    <div style="font-size:3rem">${over?'💔':R.w.icon}</div>
    <h1>${over?'Partida acabada':'Missió completada!'}</h1>
    <div class="bigstars" style="color:${R.w.color}">${starStr(stars)}</div>
    <p>${rnd(msgs)}</p>
    <p>Encerts: <b>${R.correct}/${n}</b> · Punts: <b>${R.score}</b> ${newBest?'🏅 <b>Nou rècord!</b>':''}<br>Millor ratxa: <b>${R.bestStreak}</b> 🔥 · Pistes fetes servir: <b>${R.hintsTotal}</b></p>
    ${up?`<div class="fb ok" style="display:block">🎉 <b>Has pujat de rang!</b> Ara ets <b>${RANKS[nr][2]}</b> ${RANKS[nr][1]}</div>`:''}
    ${(!over && id!=='final' && finalUnlocked() && stars>=1)?`<p>🏆 El <b>Repte final</b> està desbloquejat!</p>`:''}
    <div class="actions" style="justify-content:center">
      <button class="btn" style="background:${R.w.color}" onclick="startRound('${id}')">🔄 Tornar a jugar</button>
      <button class="btn ghost" onclick="goHome()">🗺️ Tornar al mapa</button>
    </div></div>`;
  if(stars===3 || up){ beep('win'); confetti(); }
}
function confetti(){
  const em=['⚡','⭐','🧲','☢️','🎉','✨'];
  for(let i=0;i<40;i++){ const s=document.createElement('div'); s.className='confetti'; s.textContent=rnd(em);
    s.style.left=Math.random()*100+'vw'; s.style.animationDuration=(2+Math.random()*2.5)+'s'; s.style.animationDelay=Math.random()*0.8+'s';
    document.body.appendChild(s); setTimeout(()=>s.remove(),5200); }
}

hdr(); goHome();
</script>
